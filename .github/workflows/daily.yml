name: Daily projections

# Runs every morning: grades last night, retrains, projects tonight, publishes.
# Model code lives in the private basketballpe-engine repo; only the built
# website is published here (to the gh-pages branch).
on:
  schedule:
    - cron: "23 10 * * *"   # 6:23 AM ET (5:23 AM in winter); GitHub often starts it 2-5 hours late
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-projections
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ostromaj/basketballpe-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install
        run: pip install -r engine/requirements.txt

      - name: Refresh data, train, project, grade
        working-directory: engine
        run: python -m engine.run_daily --out "$GITHUB_WORKSPACE/site_out"

      - name: Save data back to the engine
        if: always()
        working-directory: engine
        run: |
          git config user.name "basketballpe-bot"
          git config user.email "basketballpe-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Data $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish
        run: |
          # Keep older player pages (they stay findable in search); replace everything else.
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name players -exec rm -rf {} +
          cp -r site_out/. pages/
          cd pages
          git config user.name "basketballpe-bot"
          git config user.email "basketballpe-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Publish $(date -u +%F)"
          git push -q
